spring.application.name=blog-app-api

server.port=5000



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#create, update, create-drop, validate
spring.jpa.hibernate.ddl-auto=update


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
project.image=./images

#security related
#HERE WE WILL GET ALL THE SECURITY RELATED LOGS IN OUR CONSOLE
logging.level.org.springframework.security=DEBUG 
#
#spring.security.user.name=${SECURITY_USER_NAME:sushmita}
#spring.security.user.password=${SECURITY_USER_PASSWORD:sushmita}
#now we will store the above information in database and use that for authentication using jwt authentication

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.default-produces-media-type=application/json
spring.security.debug=true


spring.profiles.active=dev
